# sources.yml — Data provenance metadata
# License axis: FI-Statutory-PD (Finnish statutory public domain)
# Statutory basis: Tekijänoikeuslaki 9 § (404/1961, as amended by 608/2015) —
# laws and decrees, decisions and statements of public authorities, and
# translations of these works produced by or commissioned by public
# authorities are excluded from copyright protection.
# Verified verbatim 2026-05-17.
# Cross-ref: docs/audits/2026-05-17-eu-copyright-statutory-works-batch-1a-AT-BE-DK-FI-FR.md
# Catalog entry: infrastructure/attribution-licenses.json → "FI-Statutory-PD"

schema_version: '1.0'
mcp_name: 'Finnish Law MCP'
jurisdiction: 'FI'

sources:
  - name: 'Finlex'
    authority: 'Finnish Ministry of Justice'
    official_portal: 'https://finlex.fi'
    canonical_identifier: 'Statute number (e.g., 1050/2018)'
    retrieval_method: 'API'
    api_documentation: 'https://finlex.fi/fi/api/'
    # Version discipline (issue #78): statutes are acquired from the CURRENT
    # consolidation (akn/fi/act/statute-consolidated/{y}/{n}/fin@latest, ELI
    # ajantasa) and version-stamped in each seed (`_ingest`). The original
    # as-enacted expression (act/statute/.../fin@, ELI alkup) is used only on
    # a definitive consolidated 404. Refresh sweep: `npm run ingest:refresh`.
    update_frequency: 'daily'
    last_ingested: '2026-06-10'
    last_verified: '2026-06-10'
    license_or_terms:
      type: 'FI-Statutory-PD'
      url: 'https://finlex.fi/fi/lainsaadanto/1961/404'
      summary: 'Finnish statutory public domain (Tekijänoikeuslaki 9 §, 404/1961 as amended by 608/2015). Laws and decrees, decisions and statements of public authorities, and authority-produced translations of these works are excluded from copyright protection. Statute-level basis on the underlying text; Finlex compilation is additionally redistributable under government open-data terms.'
    coverage:
      scope: 'Finnish statutes and regulations'
      limitations: 'Historical versions depend on Finlex coverage'
    languages:
      - 'fi'
      - 'sv'  # Finland has Swedish as official language too
  - name: 'EUR-Lex'
    authority: 'Publications Office of the European Union'
    official_portal: 'https://eur-lex.europa.eu'
    canonical_identifier: 'CELEX number (e.g., 32016R0679)'
    retrieval_method: 'EUR-Lex CELLAR API'
    api_documentation: 'https://eur-lex.europa.eu/content/tools/webservices/SearchWebServiceUserManual_v2.00.pdf'
    update_frequency: 'as needed'
    last_ingested: '2026-02-14'
    last_verified: '2026-05-09'
    license_or_terms:
      type: 'EU public domain'
      url: 'https://eur-lex.europa.eu/content/legal-notice/legal-notice.html'
      summary: 'EU law documents are public domain'
    coverage:
      scope: 'EU directives and regulations referenced by Finnish statutes'
      limitations: 'Metadata only — full EU regulation text available via EU Regulations MCP'
    languages:
      - 'en'
      - 'fi'

data_freshness:
  automated_checks: true
  check_frequency: 'daily'
  last_verified: '2026-06-10'

# Fix-Sweep rebuild contract (chassis corpus freshness automation).
# Schema: Ansvar-Architecture-Documentation/infrastructure/policy/rebuild-contract.schema.json
# Runbook: Ansvar-Architecture-Documentation/docs/runbooks/fix-sweep.md
# Supersedes the 2026-06-10 fan-out's runnable:false draft (unpushed commit
# 55d28cd on feat/2026-06-10-rebuild-contract): the "corrupted seed data" that
# blocked that declaration was uncommitted chassis-migration WIP in the working
# tree, not the committed corpus. On this branch the committed seeds build.
rebuild_contract:
  schema_version: '1.0'
  runnable: true
  ingest_cmd: 'npm run ingest:refresh'
  build_cmd: 'npm run build:db'
  build_cwd: '.'
  premium_build_cmd: 'npm run build:db:paid'
  output_db: 'data/database.db'
  schema_kind: 'statute'
  drift_cmd: 'npm run drift:detect'
  golden_hashes: 'fixtures/golden-hashes.json'
  node_version: '22'
